<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>CastDuo</title>
   <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.min.js"></script>
   <style>
      html, body {
         margin: 0;
         padding: 0;
         width: 100%;
         height: 100%;
         overflow: hidden;
         background: #000;
      }
      #bgImage, #tvPlayer {
         position: absolute;
         top: 0;
         left: 0;
         width: 100%;
         height: 100%;
      }
      #bgImage {
         object-fit: cover;
         z-index: 1;
         transition: opacity 0.3s ease;
      }
      #bgImage.hidden { opacity: 0; }
      #tvPlayer {
         object-fit: contain;
         z-index: 2;
         background: transparent;
      }
   </style>
</head>
<body>
<img
         id="bgImage"
         src="https://firebasestorage.googleapis.com/v0/b/screen-mirroring-49598.firebasestorage.app/o/chrome_success%2FCongratulation.webp?alt=media&token=a5d7ce4c-1915-4528-af5e-99e319a792ba"
         alt="EcoMirror Background"
      />
   <video id="tvPlayer" playsinline></video>
   <script>
(function () {
   "use strict";

   var video = document.getElementById("tvPlayer");
   var background = document.getElementById("bgImage");
   var currentPlayer = null;
   var liveEdgeOffset = 0.3;

   if (!window.cast || !cast.framework) return;
   if (window.mpegts && mpegts.LoggingControl) {
      mpegts.LoggingControl.enableAll = false;
   }

   var context = cast.framework.CastReceiverContext.getInstance();
   var manager = context.getPlayerManager();

   function stopPlayer() {
      var previous = currentPlayer;
      currentPlayer = null;
      if (previous) {
         try { previous.destroy(); }
         catch (error) {
            // Vẫn giải phóng video nếu thư viện không huỷ được phiên cũ.
            video.pause();
            video.removeAttribute("src");
            video.load();
         }
      }
      video.playbackRate = 1;
      background.classList.remove("hidden");
   }

   function stopIfCurrent(player) {
      if (currentPlayer === player) stopPlayer();
   }

   video.addEventListener("error", function () {
      if (currentPlayer) stopPlayer();
   });
   window.addEventListener("beforeunload", stopPlayer);

   manager.setMessageInterceptor(cast.framework.messages.MessageType.STOP, function (request) {
      stopPlayer();
      return request;
   });

   manager.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, function (request) {
      stopPlayer();
      if (!request || !request.media) return request;
      var url = request.media.contentId || "";
      // Chỉ nhận luồng mirror; media thông thường tiếp tục qua CAF.
      if (!/\/stream\.ts(?:[?#]|$)/i.test(url)) return request;
      if (!window.mpegts || !mpegts.getFeatureList().mseLivePlayback) return request;

      var player;
      try {
         player = mpegts.createPlayer({
            type: "mse",
            isLive: true,
            url: url
         }, {
            enableStashBuffer: true,
            stashInitialSize: 16384,
            lazyLoad: false,
            deferLoadAfterSourceOpen: false,
            autoCleanupSourceBuffer: true,
            autoCleanupMaxBackwardDuration: 5,
            autoCleanupMinBackwardDuration: 2,
            fixAudioTimestampGap: true,
            // Chỉ dùng tăng tốc phát để đuổi live, tránh hai cơ chế tranh nhau seek.
            liveBufferLatencyChasing: false,
            liveSync: true,
            liveSyncMaxLatency: 1.2,
            liveSyncTargetLatency: liveEdgeOffset,
            liveSyncPlaybackRate: 1.05
         });
         currentPlayer = player;
         player.on(mpegts.Events.ERROR, function () { stopIfCurrent(player); });
         player.attachMediaElement(video);
         player.load();
      } catch (error) {
         stopIfCurrent(player);
         return null;
      }
      // load() có thể phát lỗi đồng bộ qua event.
      if (currentPlayer !== player) return null;

      // Gọi play ngay sau load; trình duyệt phát khi khung đầu giải mã được.
      // mpegts.js StartupStallJumper tự xử lý timestamp bắt đầu khác 0.
      // Không seek tới live edge trước khung đầu và không đợi đủ 0.4s buffer.
      video.muted = false;
      video.volume = 1;
      try {
         Promise.resolve(video.play()).then(function () {
            if (currentPlayer === player) background.classList.add("hidden");
         }, function () {
            stopIfCurrent(player);
         });
      } catch (error) {
         stopIfCurrent(player);
      }
      return null;
   });

   context.start({ disableIdleTimeout: true });
})();
   </script>
</body>
</html>
