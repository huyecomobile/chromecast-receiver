<!DOCTYPE html>

   <head>

      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>CastDuo</title>
      <!-- CAF SDK chỉ preload ở đây, thẻ nạp thật ở cuối body: nạp đồng bộ trong head là TV đen thêm đúng
           thời gian tải SDK. -->
      <link
         rel="preload"
         as="script"
         href="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"
      />
      <!-- mpegts.js `defer` có chủ ý: đồng bộ thì cả nhánh fMP4 cũng chờ nó; nạp lúc LOAD thì nhánh TS phụ
           thuộc CDN đúng lúc cast. `defer` tải song song, xong trước khi LOAD tới. -->
      <script
         id="mpegtsLib"
         defer
         src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.min.js"
      ></script>
      <style>

            height: 100%;
            overflow: hidden;

            Đặt trên <img> chứ không trên <body>: <body> phải đen cho dải letterbox. */
         #bgImage {

            background: #3f4afe url("data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAAMKADAAQAAAABAAAAGwAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8AAEQgAGwAwAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMABAQEBAQEBgQEBgkGBgYJDAkJCQkMDwwMDAwMDxIPDw8PDw8SEhISEhISEhUVFRUVFRkZGRkZHBwcHBwcHBwcHP/bAEMBBAUFBwcHDAcHDB0UEBQdHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHf/dAAQAA//aAAwDAQACEQMRAD8AhmmjuMurbZO4PQ/jWVKz5285rMluMA4rt72ztzb3NrZ2drFbw2Mcz3crFpGleISBEy2QSc9OB3r+mJWouKfX8Nv89EfPbnFTuy9eD6VnmdeQwznv6Vv6fodzfWsM6oSJkD/61VHzHaPvLgc9eeOh5wKu/wDCGXZk/wBVgblXBnj6l9nXGOD1I4A5NdX1qhBuM5K/qv8AMyle1ziJXTJrOndRnFdpqnh82lk12qH5XRD84bBYE4ICjsK465Xyw/yKdw2/MM49x716WGrQqaxZwyxCT5Wf/9DzeW5YqMngZx7VSeTzOGJI9CTj8ulQljjGeM1Eh5r+wI00kfKSZrxKH2rmtm0tGb5QM546Z61l2QBIrsbFV44rxsZVcE7HhY6u4RdhItM3LjFZWo6Z8pOK72EAKCOCKz9RVSh4r56jjZ+1PjoY2ftT/9k=") center / cover no-repeat;
         }
         #bgImage.hidden {
            opacity: 0;
            pointer-events: none;
         }
         /* object-fit do TỪNG NHÁNH đặt trong JS, không để CSS quyết định hộ. */
         #tvPlayer {
            z-index: 2;
            background: transparent;
         }
         /* Vòng chờ tới khung hình đầu — nằm TRÊN <video> (thẻ đó vẽ đen khi chưa có khung). Ẩn bằng
            `display: none` để animation không chạy ngầm suốt phiên trên TV yếu. */
         #loading {
            display: none;
            position: absolute;
            /* Dưới khối chữ "Connected successfully / CONGRATS" của ảnh nền (~37–50% chiều cao). */
            top: 74%;
            left: 50%;
            width: 11vmin;
            height: 11vmin;
            margin: -5.5vmin 0 0 -5.5vmin;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 50;
            pointer-events: none;
         }
         /* Chờ 250ms mới hiện: lượt lên hình nhanh không bị chớp vòng xoay. */
         #loading.show {
            display: block;
            animation: loadingFadeIn 0.2s ease 0.25s both;
         }
         #loading .ring {
            position: absolute;
            top: 2vmin;
            left: 2vmin;
            right: 2vmin;
            bottom: 2vmin;
            border: 0.7vmin solid rgba(255, 255, 255, 0.25);
            border-top-color: #fff;
            border-radius: 50%;
            animation: loadingSpin 0.9s linear infinite;
            will-change: transform;
         }
         @keyframes loadingSpin {
            to {
               transform: rotate(360deg);

         @keyframes loadingFadeIn {
            from {
               opacity: 0;
            }
            to {
               opacity: 1;
            }
         }
         /* Lỗi cuối cùng — không phụ thuộc overlay; thiếu nó mọi hỏng hóc đều là màn đen câm. */
         #fatal {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 12%;
            z-index: 100000;
            color: #fff;
            font-family: sans-serif;
            font-size: 26px;
            text-align: center;
            text-shadow: 0 2px 6px #000;
            padding: 0 6vw;
         }
         #stats {
            position: absolute;
            top: 8px;

            color: #0f0;

            line-height: 1.35;
            z-index: 99999;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.82);

         }
         #debug {
            position: absolute;
            bottom: 8px;

            font-size: 14px;
            line-height: 1.3;
            z-index: 99999;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.82);
            padding: 8px 10px;
            white-space: pre-wrap;

   </head>
   <body>
      <img
         id="bgImage"
         fetchpriority="high"
         decoding="async"
         src="https://firebasestorage.googleapis.com/v0/b/screen-mirroring-49598.firebasestorage.app/o/chrome_success%2FCongratulation.webp?alt=media&token=64d89df8-8bf6-4b75-8785-d5e55565cc7e"
         alt="EcoMirror Background"
      />
      <video id="tvPlayer" playsinline></video>
      <!-- Bật sẵn: receiver này chỉ mở khi bấm Start mirror. -->
      <div id="loading" class="show" aria-hidden="true"><div class="ring"></div></div>
      <div id="fatal" class="hideDebug"></div>
      <div id="stats"></div>
      <div id="debug"></div>

      <!-- Phải đứng ngay trước script receiver (dùng `cast` ở dòng đầu). -->
      <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
      <script>
         (function () {
            "use strict";

            /* CastDuo receiver — HAI nhánh độc lập trên cùng `/stream.ts`, chọn theo `contentType` của LOAD:
             * MPEG-TS (video/MP2T) → mpegts.js (NHÁNH A); fMP4 (video/mp4) → MSE native (NHÁNH B).
             *
             * 🔴 Hai nhánh KHÔNG dùng chung biến điều khiển nào (hằng số, setInterval, hàm dọn); chỉ chung thẻ
             * <video>, ảnh nền, `#loading`, `activeBranch`. Bản 23/09/2026 gộp chung bộ điều khiển phát ⇒ ngưỡng
             * theo fragment fMP4 ~66ms áp lên TS (đơn vị GOP 1000ms) ⇒ gán `currentTime` liên tục, TS chết hẳn.
             * Không thăm dò định dạng bằng HTTP: mỗi request vào `TsHttpServer` là một lần `buffer.clear()`. */

            var RECEIVER_VERSION = "2026-10-06a";
            var T_BOOT = Date.now(); // mốc đo thời gian tới khung hình đầu (log)

            /* ══════════════════════ Dùng chung — TỐI THIỂU ══════════════════════ */

            var CONFIG_DIAG = {
               // Overlay chẩn đoán — TẮT ở bản phát hành; bật theo lượt bằng `?diag=1` (setDiagForLoad).
               DEBUG_OVERLAY: false,
            };

            var video = document.getElementById("tvPlayer");
            var background = document.getElementById("bgImage");
            var loadingEl = document.getElementById("loading");
            var fatalEl = document.getElementById("fatal");
            var statsEl = document.getElementById("stats");
            var debugEl = document.getElementById("debug");

            // Không LOAD nào tới (sender / CAF hỏng) thì tắt spinner sau hạn này. Đặt TRƯỚC `return` dưới:
            // ca CAF hỏng chính là ca cần nó.
            var BOOT_LOADING_MAX_MS = 15000;
            setTimeout(function () { if (!loadSeq) hideLoading(); }, BOOT_LOADING_MAX_MS);

            if (typeof cast === "undefined" || !cast.framework) return;

            var context = cast.framework.CastReceiverContext.getInstance();
            var manager = context.getPlayerManager();

            /** "ts" | "fmp4" | null — biến DUY NHẤT mà cả hai nhánh cùng đụng tới. */
            var activeBranch = null;

            /** Vé của lượt LOAD: hai LOAD cùng TS nối nhau lúc mpegts.js còn tải thì lượt chờ cũ không được
             *  dựng player cho URL đã bị thay — `activeBranch` một mình không phân biệt được. */
            var loadSeq = 0;

            /** Gương chẩn đoán MỘT CHIỀU: nhánh ghi, chỉ overlay đọc — không dòng điều khiển nào đọc `diag`. */
            var diag = { mode: "—", fmp4: null };

            var logLines = [];
            var MAX_LOG_LINES = 14;
            var statsErrShown = false;
            var lagHist = [];

            /** Chẩn đoán bật: cờ `DEBUG_OVERLAY`, hoặc LOAD mang `?diag=1` (`enableDiag`). */
            var diagOn = CONFIG_DIAG.DEBUG_OVERLAY;
            var diagOverlayStarted = false;

            if (!diagOn) {
               statsEl.className = "hideDebug";
               debugEl.className = "hideDebug";
            }

            function ts2() {
               var d = new Date();
               return (
                  ("0" + d.getMinutes()).slice(-2) + ":" +
                  ("0" + d.getSeconds()).slice(-2) + "." +
                  ("00" + d.getMilliseconds()).slice(-3)
               );
            }

            /** Nhật ký chẩn đoán — không làm gì khi chẩn đoán tắt. */
            function log(msg) {
               if (!diagOn) return;
               try {
                  logLines.push(ts2() + "  " + msg);
                  if (logLines.length > MAX_LOG_LINES) logLines.shift();
                  debugEl.textContent = logLines.join("\n");
                  console.log("[CastDuo] " + msg);
               } catch (e) {}
            }

            /** Chẩn đoán theo LOAD (`?diag=1`); LOAD sau không có cờ thì tắt lại. Chỉ đo, không đổi cách phát. */
            var diagByLoad = false;

            function setDiagForLoad(on) {
               if (CONFIG_DIAG.DEBUG_OVERLAY) return;
               if (on) { enableDiag(); return; }
               if (!diagByLoad) return;
               diagByLoad = false;
               diagOn = false;
               try {
                  statsEl.className = "hideDebug";
                  debugEl.className = "hideDebug";
               } catch (e) {}
            }

            function enableDiag() {
               if (diagOn) return;
               diagOn = true;
               diagByLoad = true;
               try {
                  statsEl.className = "";
                  debugEl.className = "";
               } catch (e) {}
               startDiagOverlay();
               log("chẩn đoán bật theo LOAD (?diag=1) — bản " + RECEIVER_VERSION);
            }

            /** Vòng chờ — CHỈ hiển thị, cùng loại với ảnh nền: không dòng điều khiển nào được đọc nó. */
            function showLoading() {
               try { loadingEl.classList.add("show"); } catch (e) {}
            }

            function hideLoading() {
               try { loadingEl.classList.remove("show"); } catch (e) {}
            }

            function showFatal(msg) {
               log("🔴 " + msg);
               hideLoading();
               try {
                  fatalEl.textContent = msg;
                  fatalEl.className = "";
                  background.classList.remove("hidden");
               } catch (e) {}
            }

            function clearFatal() {
               try {
                  fatalEl.textContent = "";
                  fatalEl.className = "hideDebug";
               } catch (e) {}
            }

            /** Dọn đúng nhánh đang chạy rồi trả màn hình về trạng thái chờ. */
            function stopAll() {
               var branch = activeBranch;
               activeBranch = null;
               if (branch === "ts") stopTs();
               else if (branch === "fmp4") stopFmp4();
               diag.mode = "—";
               try { video.playbackRate = 1; } catch (e) {}
               hideLoading();
               background.classList.remove("hidden");
            }

            // Lỗi của thẻ <video> thuộc về nhánh đang giữ nó. Sau `stopAll()` thì `activeBranch`
            // rỗng nên lần bắn lại (do `video.load()` trong lúc dọn) là no-op — đúng như bản ổn định.
            video.addEventListener("error", function () {
               if (!activeBranch) return;
               // fMP4 tự nối lại khi luồng hỏng — cách xử lý nằm trong nhánh của nó (`onFmp4VideoError`).
               if (activeBranch === "fmp4") { onFmp4VideoError(); return; }
               var err = video.error;
               log("VIDEO ERROR code=" + (err ? err.code : "?") +
                   " msg=" + (err && err.message ? err.message : ""));
               stopAll();
               showFatal("Không phát được luồng từ điện thoại");
            });
            window.addEventListener("beforeunload", stopAll);

            /* ═════════════ NHÁNH A — MPEG-TS ═════════════
             * Không watcher, không seek: đuổi live giao trọn cho `liveSync*` của mpegts.js. Tham số là bản đã
             * kiểm chứng trên TV — đổi thì phải đo lại. */

            var tsPlayer = null;
            var tsLiveEdgeOffset = 0.3;
            var mpegtsState = null; // "ready" | "failed" | null (đang tải)
            var mpegtsWaiters = [];
            var MPEGTS_WAIT_MS = 3000;

            (function watchMpegtsScript() {
               if (typeof mpegts !== "undefined") { mpegtsState = "ready"; return; }
               var el = document.getElementById("mpegtsLib");
               if (!el) { mpegtsState = "failed"; return; }
               el.addEventListener("load", function () { settleMpegts("ready"); });
               el.addEventListener("error", function () { settleMpegts("failed"); });
            })();

            function settleMpegts(state) {
               if (mpegtsState) return;
               mpegtsState = state;
               log("mpegts.js " + state + " (+" + (Date.now() - T_BOOT) + "ms)");
               var waiters = mpegtsWaiters;
               mpegtsWaiters = [];
               for (var i = 0; i < waiters.length; i++) waiters[i](state === "ready");
            }

            /** Lưới an toàn quanh thẻ `defer`: thư viện gần như luôn sẵn sàng trước khi LOAD tới. */
            function whenMpegtsReady(onDone) {
               if (mpegtsState) { onDone(mpegtsState === "ready"); return; }
               mpegtsWaiters.push(onDone);
               setTimeout(function () { settleMpegts("failed"); }, MPEGTS_WAIT_MS);
            }

            function stopTs() {
               var previous = tsPlayer;
               tsPlayer = null;
               if (previous) {
                  try {
                     previous.destroy();
                  } catch (error) {
                     // Vẫn giải phóng video nếu thư viện không huỷ được phiên cũ.
                     video.pause();
                     video.removeAttribute("src");
                     video.load();
                  }
               }
            }

            function stopTsIfCurrent(player, message) {
               // LOAD mới đã gọi `stopAll()` nên `tsPlayer` khác `player`; so sánh này giữ cho
               // một player cũ chết muộn không giết được phiên đang chạy.
               if (tsPlayer !== player) return;
               stopAll();
               if (message) showFatal(message);
            }

            function startMpegTs(url, request, ticket) {
               return new Promise(function (resolve) {
                  whenMpegtsReady(function (ready) {
                     // đã bị STOP, hoặc một lệnh LOAD sau đã chiếm chỗ
                     if (activeBranch !== "ts" || ticket !== loadSeq) { resolve(null); return; }
                     if (!ready || typeof mpegts === "undefined" ||
                         !mpegts.getFeatureList().mseLivePlayback) {
                        activeBranch = null;
                        showFatal("TV chưa tải được thư viện giải mã — kiểm tra mạng của TV");
                        resolve(request); // nhường CAF, đúng như bản ổn định
                        return;
                     }
                     startMpegTsNow(url);
                     resolve(null);
                  });
               });
            }

            function startMpegTsNow(url) {
               if (mpegts.LoggingControl) mpegts.LoggingControl.enableAll = false;
               video.style.objectFit = "contain";
               diag.mode = "MPEG-TS/mpegts.js";

               var player;
               try {
                  player = mpegts.createPlayer(
                     {
                        type: "mse",
                        isLive: true,
                        url: url,
                     },
                     {
                        enableStashBuffer: true,
                        stashInitialSize: 16384,
                        lazyLoad: false,
                        deferLoadAfterSourceOpen: false,
                        autoCleanupSourceBuffer: true,
                        autoCleanupMaxBackwardDuration: 5,
                        autoCleanupMinBackwardDuration: 2,
                        fixAudioTimestampGap: true,
                        // Chỉ dùng tăng tốc phát để đuổi live, tránh hai cơ chế tranh nhau seek.
                        liveBufferLatencyChasing: false,
                        liveSync: true,
                        liveSyncMaxLatency: 1.2,
                        liveSyncTargetLatency: tsLiveEdgeOffset,
                        liveSyncPlaybackRate: 1.05,
                     },
                  );
                  tsPlayer = player;
                  player.on(mpegts.Events.ERROR, function (type, detail) {
                     log("mpegts ERROR: " + type + " / " + detail);
                     stopTsIfCurrent(player, "Mất luồng từ điện thoại — thử cast lại");
                  });
                  player.attachMediaElement(video);
                  player.load();
                  log("mpegts.js load()  (+" + (Date.now() - T_BOOT) + "ms)");
               } catch (error) {
                  stopTsIfCurrent(player);
                  return;
               }
               // load() có thể phát lỗi đồng bộ qua event.
               if (tsPlayer !== player) return;

               // Gọi play ngay sau load; trình duyệt phát khi khung đầu giải mã được.
               // mpegts.js StartupStallJumper tự xử lý timestamp bắt đầu khác 0.
               // Không seek tới live edge trước khung đầu và không đợi đủ 0.4s buffer.
               video.muted = false;
               video.volume = 1;
               try {
                  Promise.resolve(video.play()).then(
                     function () {
                        if (tsPlayer === player) {
                           background.classList.add("hidden");
                           hideLoading();
                        }
                     },
                     function () {
                        stopTsIfCurrent(player);
                     },
                  );
               } catch (error) {
                  stopTsIfCurrent(player);
               }
            }

            /* ══════════════════ NHÁNH B — fMP4 (MSE native) ══════════════════ */

            var FMP4_CONFIG = {
               // 🔴 Đệm tự thích nghi (05/10/2026; số đo + lý do: `direct/AGENT.MD`, "Giật nhịp ngắn"). Chrome chỉ
               // phát khi hàng đợi TIẾNG ≥ ngưỡng (200ms; hụt là NHÂN ĐÔI tới 3s, chỉ về 200ms khi seek) ⇒ đuổi
               // mạnh rút đệm là hụt, dừng lâu hơn, nhảy, lặp. Nên: đứng hình (currentTime không chạy — Chrome
               // dừng khi `buffered` còn 0,1–0,3s) ⇒ nâng `đích`; mạng yên ⇒ hạ dần. Tốc độ theo ĐÁY/ĐỈNH lag
               // trong 8s (dài hơn chu kỳ xóc), không theo một mẫu. Chỉ đúng cho fragment ~100–133ms.
               targetBaseSec: 0.4,      // đích khởi điểm và sàn (05/10: người dùng chọn ưu tiên trễ thấp)
               targetMaxSec: 1.2,       // trần đích
               startExtraSec: 0.1,      // mở ở lag = đích + ~một fragment ⇒ đáy răng cưa nằm đúng đích
               stallStepSec: 0.1,       // mỗi lần đứng hình: đích ≥ đích cũ + ngần này, và ≥ lag lúc phát lại
               minStallMs: 80,          // đứng ngắn hơn không tính
               stallAdvanceRatio: 0.3,  // trong một nhịp currentTime chạy < 30% mức kỳ vọng ⇒ đứng
               calmSec: 20,             // không đứng hình ngần này thì mới xét hạ đích
               checkEverySec: 10,       // mỗi ngần này xét lại đích theo MỰC ĐỆM THẤP NHẤT quãng vừa qua:
               nearMissSec: 0.08,       //  - từng tụt dưới ngần này (suýt hụt) ⇒ nâng đích trước khi kịp đứng hình
               decaySpareSec: 0.2,      //  - luôn dư ≥ ngần này ⇒ mới hạ. Cú xóc bị đệm nuốt trọn vẫn là bằng chứng
                                        //    mạng còn rung — chỉ đếm lần đứng hình thì hạ vội rồi đứng lại
               decayStepSec: 0.05,      // 1,2s → 0,4s mất ~3 phút yên ổn
               tickMs: 100,
               decideEveryTicks: 5,     // chọn tốc độ mỗi 500ms
               lagWindowSec: 8,
               rateHoldSec: 4,          // rời ×1 / đổi giữa hai tốc độ ≠ 1: cách lần đổi trước ≥ ngần này. Về ×1 thì ngay
               chaseOverSec: 0.25,      // đáy lag > đích + ngần này ⇒ ×chaseRate
               chaseRate: 1.05,         // nhẹ như nhánh TS — ×1,15/×1,25 cũ tự gây giật và rút đệm quá nhanh
               fastChaseOverSec: 0.7,
               fastChaseRate: 1.1,
               chaseExitOverSec: 0.03,  // đang đuổi: về ×1 khi đáy lag ≤ đích + ngần này — sát đích, vì không còn
                                        // gì kéo lag xuống nữa (mốc thật không hụt): thoát sớm là trễ dư mãi
               refillExitOverSec: 0.15, // đỉnh lag < đích ⇒ ×refillRate; về ×1 khi đỉnh ≥ đích + ngần này
               refillRate: 0.97,        // đường FFmpeg vẫn hụt dòng thời gian dần (số khung × 33,3ms) ⇒ còn cần bồi
               hardSeekOverSec: 1.5,    // đáy lag > đích + ngần này mới nhảy: seek = giải mã lại từ IDR, tự nó là giật
               selfSeekIgnoreMs: 1000,  // sau seek của chính receiver: đứng là do seek, không nâng đích
               // Nhảy bắt kịp sau đứng hình: phần dồn ở điện thoại xả sang vài giây SAU khi hình chạy lại ⇒ chờ lag
               // thôi tăng rồi mới nhảy. 🔴 Cú nhảy là một lần giật RIÊNG (giải mã lại từ IDR) ⇒ chỉ nhảy khi dư
               // > 2s, dư ít để vòng đuổi kéo dần (05d nhảy từ 0,5s: giật nhiều hơn — `direct/AGENT.MD`).
               catchUpWindowMs: 8000,
               catchUpOverSec: 2.0,
               catchUpStableSec: 0.15,  // lag tăng < ngần này trong 1s gần nhất = đã xả xong
               rescueAfterMs: 1000,     // đứng ≥ ngần này mà đệm vẫn có ⇒ seek về `end − đích` (xả hàng đợi tiếng của
                                        // Chrome); lối thoát duy nhất khi kẹt ở khe / decoder — chờ là đứng mãi
               maxBackBufferSec: 3,   // giữ tối đa bao nhiêu giây phía sau currentTime
               trimBatchSec: 2,       // dọn THEO LÔ: mỗi `remove()` chặn lượt append kế — dọn vụn là tắc nhỏ liên tục
               trimEveryAppends: 10,  // xét dọn mỗi 10 lần append (~1 giây), không phải mỗi lần
               emptyAppendsFatal: 12, // ~1,2 giây byte về mà không giải mã được gì ⇒ báo lỗi
               // Luồng đứt (LỖI) thì nối lại; tổng các lượt chờ (3,5s) PHẢI gọn trong ân hạn 5s của app
               // (`FMP4_RECONNECT_GRACE_MS`). Kết thúc GỌN (`done`) là điện thoại dừng — `endFmp4FromPhone`.
               reconnectDelaysMs: [500, 1000, 2000],
               reconnectHealthyMs: 10000, // chạy khoẻ ngần này thì sự cố sau là chuỗi mới, đếm lại từ 0
               connectTimeoutMs: 3000,    // fetch chưa có header sau ngần này ⇒ coi như hỏng
            };

            var fmp4 = null;
            var fmp4ReadyTimer = null;
            var fmp4PaceTimer = null;
            var fmp4Url = null;
            var fmp4Retries = 0;          // số lượt nối lại liên tiếp đã dùng
            var fmp4RetryTimer = null;
            var fmp4ConnSeq = 0;          // vé của lượt kết nối: callback của lượt cũ tự bỏ
            var fmp4EverPlayed = false;   // lượt LOAD này đã từng có hình — chỉ để chọn câu báo lỗi

            /* ── Đo khựng hình — CHỈ khi `diagOn`. Chỉ ĐO (không dòng điều khiển nào đọc `fmp4Diag`); mỗi 10s và
             * mỗi lần khựng gửi một dòng về `/diag` của điện thoại, nằm cùng logcat với dòng `nhịp`. ── */
            var fmp4Diag = null;        // số đo của lượt LOAD này (qua cả các lần nối lại)
            var FMP4_DIAG = { reportEveryMs: 10000 };

            function newFmp4Diag() {
               return {
                  stalls: 0, stallMs: 0, maxStallMs: 0, waiting: 0, rateChanges: 0, seeks: 0,
                  reconnects: 0, lastDropped: 0, lastTotal: 0, lastBytesIn: 0, lastReportMs: 0,
                  win: newFmp4DiagWindow(),
               };
            }

            function newFmp4DiagWindow() {
               return {
                  stalls: 0, stallMs: 0, maxStallMs: 0, waiting: 0, rateChanges: 0, seeks: 0,
                  lagMin: Infinity, lagMax: -Infinity, lagSum: 0, lagN: 0,
               };
            }

            /** Ghi log trên TV và gửi về điện thoại. Lỗi mạng nuốt im: chẩn đoán không được làm hỏng phát. */
            function reportFmp4Diag(line) {
               log("📊 " + line);
               if (!fmp4Url) return;
               try {
                  var base = fmp4Url.replace(/\/stream\.ts.*$/i, "");
                  fetch(base + "/diag?m=" + encodeURIComponent(line), { mode: "no-cors", cache: "no-store" })
                     .catch(function () {});
               } catch (e) {}
            }

            function reportFmp4DiagWindow(d, target) {
               var w = d.win;
               var q = null;
               try { q = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null; } catch (e) {}
               var dropped = q ? q.droppedVideoFrames - d.lastDropped : -1;
               var total = q ? q.totalVideoFrames - d.lastTotal : -1;
               if (q) { d.lastDropped = q.droppedVideoFrames; d.lastTotal = q.totalVideoFrames; }
               var bytesIn = fmp4 ? fmp4.bytesIn : 0;
               var kb = Math.max(0, Math.round((bytesIn - d.lastBytesIn) / 1024));
               d.lastBytesIn = bytesIn;
               var lagStr = w.lagN > 0
                  ? w.lagMin.toFixed(2) + "/" + (w.lagSum / w.lagN).toFixed(2) + "/" + w.lagMax.toFixed(2) + "s"
                  : "—";
               reportFmp4Diag(
                  "10s: khựng " + w.stalls + " lần, tổng " + w.stallMs + "ms, dài nhất " + w.maxStallMs + "ms" +
                  " | waiting " + w.waiting +
                  " | lag min/tb/max " + lagStr + " | đích " + target.toFixed(2) + "s" +
                  " | đổi tốc độ " + w.rateChanges + ", nhảy " + w.seeks +
                  " | rơi khung " + dropped + "/" + total +
                  " | ×" + video.playbackRate + " | về " + kb + "KB" +
                  " | cộng dồn: khựng " + d.stalls + " lần/" + d.stallMs + "ms, nối lại " + d.reconnects
               );
               d.win = newFmp4DiagWindow();
            }

            /** Gọi mỗi nhịp của `fmp4PaceTick` khi chẩn đoán bật — chỉ ghi số, không quyết định gì. */
            function fmp4DiagTick(d, lag, playing, target, now) {
               if (playing && isFinite(lag)) {
                  var w = d.win;
                  if (lag < w.lagMin) w.lagMin = lag;
                  if (lag > w.lagMax) w.lagMax = lag;
                  w.lagSum += lag;
                  w.lagN++;
               }
               if (!d.lastReportMs) d.lastReportMs = now;
               if (now - d.lastReportMs >= FMP4_DIAG.reportEveryMs) {
                  d.lastReportMs = now;
                  reportFmp4DiagWindow(d, target);
               }
            }

            function fmp4DiagStall(d, lostMs, lagBefore, rate, lagAfter, target, how) {
               d.stalls++; d.stallMs += lostMs; d.maxStallMs = Math.max(d.maxStallMs, lostMs);
               d.win.stalls++; d.win.stallMs += lostMs; d.win.maxStallMs = Math.max(d.win.maxStallMs, lostMs);
               reportFmp4Diag("⛔ đứng hình " + lostMs + "ms" + (how ? " (" + how + ")" : "") +
                  " | lag cao nhất 1s trước " + lagBefore.toFixed(2) +
                  "s | tốc độ lúc đó ×" + rate + " | lag lúc " + (how ? "nhảy " : "phát lại ") + lagAfter.toFixed(2) +
                  "s | readyState " + video.readyState + " | đích → " + target.toFixed(2) + "s");
            }

            /* -------------------- MP4 box parser (tối thiểu) -------------------- */

            /** Đọc size+type của box tại `off`. Trả null khi chưa đủ byte. */
            function readBoxHeader(buf, off) {
               if (off + 8 > buf.length) return null;
               var dv = new DataView(buf.buffer, buf.byteOffset + off, 8);
               var size = dv.getUint32(0);
               var type = String.fromCharCode(buf[off + 4], buf[off + 5], buf[off + 6], buf[off + 7]);
               var headerSize = 8;
               if (size === 1) {
                  // largesize 64-bit — fMP4 hiếm khi dùng, nhưng không xử lý là parse lệch vĩnh viễn
                  if (off + 16 > buf.length) return null;
                  var dv2 = new DataView(buf.buffer, buf.byteOffset + off + 8, 8);
                  var hi = dv2.getUint32(0), lo = dv2.getUint32(4);
                  size = hi * 4294967296 + lo;
                  headerSize = 16;
               } else if (size === 0) {
                  size = buf.length - off; // "tới hết file"
               }
               return { size: size, type: type, headerSize: headerSize };
            }

            /** Codec string từ init segment — phải parse: profile tuỳ encoder từng máy, khai sai là
             *  `addSourceBuffer` ném và màn đen. */
            function codecStringFromInit(buf) {
               var codecs = [];
               try {
                  // avcC nằm sâu trong moov > trak > mdia > minf > stbl > stsd > avc1 > avcC.
                  // Quét phẳng cả buffer cho gọn — init segment chỉ vài trăm byte.
                  var i = 0;
                  var avcCOff = -1;
                  for (i = 0; i + 4 < buf.length; i++) {
                     if (buf[i] === 0x61 && buf[i + 1] === 0x76 && buf[i + 2] === 0x63 && buf[i + 3] === 0x43) {
                        avcCOff = i + 4; // ngay sau fourcc "avcC"
                        break;
                     }
                  }
                  if (avcCOff > 0 && avcCOff + 4 <= buf.length) {
                     var profile = buf[avcCOff + 1];
                     var compat = buf[avcCOff + 2];
                     var level = buf[avcCOff + 3];
                     var hex = function (n) { return ("0" + n.toString(16)).slice(-2); };
                     codecs.push("avc1." + hex(profile) + hex(compat) + hex(level));
                     log("avcC: profile=" + profile + " compat=" + compat + " level=" + level);
                  } else {
                     log("⚠️ không tìm thấy avcC — dùng codec string dự phòng");
                     codecs.push("avc1.42E01E");
                  }

                  // Có track audio không: tìm fourcc "mp4a"
                  for (i = 0; i + 4 < buf.length; i++) {
                     if (buf[i] === 0x6d && buf[i + 1] === 0x70 && buf[i + 2] === 0x34 && buf[i + 3] === 0x61) {
                        codecs.push("mp4a.40.2");
                        break;
                     }
                  }
               } catch (e) {
                  log("🔴 parse init lỗi: " + e);
                  return 'video/mp4; codecs="avc1.42E01E"';
               }
               return 'video/mp4; codecs="' + codecs.join(",") + '"';
            }

            /* ----------------------------- Fmp4Player ----------------------------- */

            function Fmp4Player(videoEl) {
               this.video = videoEl;
               this.ms = null;
               this.sb = null;
               this.objUrl = null;
               this.queue = [];
               this.pending = new Uint8Array(0); // byte chưa đủ để tạo init segment
               this.initDone = false;
               this.aborted = false;
               this.reader = null;
               this.bytesIn = 0;
               this.appends = 0;
               this.warnedEmpty = false;
               this.sawData = false; // đã từng thấy `buffered` có dữ liệu — thôi canh từ đó
               this.dataAtMs = 0;    // lúc thấy dữ liệu đầu tiên — để biết phiên đã chạy khoẻ bao lâu
            }

            Fmp4Player.prototype.concat = function (a, b) {
               var out = new Uint8Array(a.length + b.length);
               out.set(a, 0);
               out.set(b, a.length);
               return out;
            };

            /**
             * Init segment = mọi box TRƯỚC `moof` đầu tiên (ftyp + moov).
             * Trả -1 khi chưa nhận đủ.
             */
            Fmp4Player.prototype.findInitEnd = function (buf) {
               var off = 0;
               while (off < buf.length) {
                  var h = readBoxHeader(buf, off);
                  if (!h || h.size <= 0) return -1;
                  if (h.type === "moof") return off; // init kết thúc ngay trước moof
                  if (off + h.size > buf.length) return -1; // box chưa về đủ
                  off += h.size;
               }
               return -1;
            };

            Fmp4Player.prototype.appendNext = function () {
               if (this.aborted || !this.sb || this.sb.updating || this.queue.length === 0) return;
               var chunk = this.queue.shift();
               try {
                  this.sb.appendBuffer(chunk);
               } catch (e) {
                  if (e && e.name === "QuotaExceededError") {
                     // SourceBuffer đầy — dọn phần đã phát rồi thử lại chính chunk này
                     log("⚠️ QuotaExceeded — dọn back buffer");
                     this.queue.unshift(chunk);
                     this.trimBackBuffer(true);
                  } else {
                     log("🔴 appendBuffer: " + e);
                  }
               }
            };

            Fmp4Player.prototype.trimBackBuffer = function (aggressive) {
               try {
                  if (!this.sb || this.sb.updating) return;
                  // Đường thường chỉ xét mỗi ~1 giây: gọi từ MỌI `updateend` (~10 lần/giây) mà lần nào
                  // cũng đọc `buffered` là việc thừa. Đường QuotaExceeded thì xét ngay.
                  if (!aggressive && this.appends % FMP4_CONFIG.trimEveryAppends !== 0) return;
                  var buffered = this.sb.buffered;
                  if (buffered.length === 0) return;
                  var start = buffered.start(0);
                  var keepFrom = this.video.currentTime - (aggressive ? 1 : FMP4_CONFIG.maxBackBufferSec);
                  var minBatch = aggressive ? 0.5 : FMP4_CONFIG.trimBatchSec;
                  if (keepFrom > start + minBatch) this.sb.remove(start, keepFrom);
               } catch (e) {}
            };

            /** Canh "byte về đều mà không giải mã được gì" (22/09 moof đơn-track, 24/09 mất IDR: `buffered` rỗng
             *  vĩnh viễn, không tầng nào báo lỗi) — chỉ tới khi thấy dữ liệu đầu; về muộn thì gỡ lỗi đã báo. */
            Fmp4Player.prototype.checkFirstData = function () {
               try {
                  if (this.sb.buffered.length > 0) {
                     this.sawData = true;
                     this.dataAtMs = Date.now();
                     fmp4EverPlayed = true;
                     if (this.warnedEmpty) clearFatal();
                     return;
                  }
                  if (!this.warnedEmpty && this.appends >= FMP4_CONFIG.emptyAppendsFatal) {
                     this.warnedEmpty = true;
                     showFatal("TV không giải mã được luồng fMP4");
                  }
               } catch (e) {}
            };

            Fmp4Player.prototype.start = function (firstChunk, reader) {
               var self = this;
               this.reader = reader;

               this.ms = new MediaSource();
               this.objUrl = URL.createObjectURL(this.ms);
               this.video.src = this.objUrl;

               this.ms.addEventListener("sourceopen", function () {
                  log("MediaSource sourceopen");
                  self.pending = firstChunk;
                  self.trySetupSourceBuffer();
                  self.pump();
               });
               this.ms.addEventListener("sourceended", function () { log("⚠️ sourceended"); });
               this.ms.addEventListener("error", function () {
                  log("🔴 MediaSource error");
                  stopFmp4IfCurrent(self, "TV không dựng được bộ giải mã cho luồng này");
               });
            };

            Fmp4Player.prototype.trySetupSourceBuffer = function () {
               if (this.initDone || this.aborted) return;
               var initEnd = this.findInitEnd(this.pending);
               if (initEnd <= 0) return; // chưa đủ byte, đợi chunk sau

               var initSeg = this.pending.subarray(0, initEnd);
               var mime = codecStringFromInit(initSeg);
               log("init segment " + initEnd + "B ⇒ " + mime);

               var supported = false;
               try { supported = MediaSource.isTypeSupported(mime); } catch (e) {}
               if (!supported) {
                  log("🔴 THIẾT BỊ KHÔNG HỖ TRỢ " + mime);
                  // Hạ xuống chỉ video — nhiều decoder từ chối vì phần audio chứ không phải video
                  var videoOnly = mime.split(",")[0] + '"';
                  try { supported = MediaSource.isTypeSupported(videoOnly); } catch (e) {}
                  if (supported) {
                     log("⚠️ lùi về " + videoOnly + " (mất tiếng)");
                     mime = videoOnly;
                  } else {
                     stopFmp4IfCurrent(this, "TV không hỗ trợ định dạng video này");
                     return;
                  }
               }

               var self = this;
               try {
                  this.sb = this.ms.addSourceBuffer(mime);
               } catch (e) {
                  log("🔴 addSourceBuffer NÉM: " + e);
                  stopFmp4IfCurrent(this, "TV không hỗ trợ định dạng video này");
                  return;
               }

               // 'sequence': xếp fragment liên tiếp, bỏ qua baseMediaDecodeTime gốc.
               // Live stream không có mốc thời gian tuyệt đối nào đáng tin để tôn trọng.
               try { this.sb.mode = "sequence"; } catch (e) {}

               this.sb.addEventListener("updateend", function () {
                  self.appends++;
                  if (!self.sawData) self.checkFirstData();
                  self.appendNext();
                  self.trimBackBuffer(false);
               });
               this.sb.addEventListener("error", function () { log("🔴 SourceBuffer error"); });

               this.initDone = true;
               this.queue.push(this.pending); // init + phần dư đi cùng một lần append
               this.pending = new Uint8Array(0);
               this.appendNext();
            };

            Fmp4Player.prototype.pump = function () {
               var self = this;
               if (this.aborted) return;
               this.reader.read().then(
                  function (res) {
                     if (self.aborted) return;
                     if (res.done) {
                        if (fmp4 === self) endFmp4FromPhone("nguồn đóng gọn (reader done)");
                        return;
                     }
                     var chunk = new Uint8Array(res.value);
                     self.bytesIn += chunk.length;

                     if (!self.initDone) {
                        self.pending = self.concat(self.pending, chunk);
                        self.trySetupSourceBuffer();
                     } else {
                        self.queue.push(chunk);
                        self.appendNext();
                     }
                     self.pump();
                  },
                  function (err) {
                     if (self.aborted) return;
                     log("🔴 reader lỗi: " + err);
                     if (fmp4 === self) recoverFmp4("reader lỗi: " + err);
                  },
               );
            };

            Fmp4Player.prototype.destroy = function () {
               this.aborted = true;
               try { this.reader && this.reader.cancel(); } catch (e) {}
               try {
                  if (this.sb && this.ms && this.ms.readyState === "open") this.ms.endOfStream();
               } catch (e) {}
               this.queue = [];
               this.pending = new Uint8Array(0);
               // 🔴 Không trả thẻ <video> về trạng thái sạch thì nhánh MPEG-TS lần sau gắn vào một
               // MediaSource đã chết — đúng ca "đổi cờ rồi cast lại là đen màn".
               try { this.video.pause(); } catch (e) {}
               if (this.objUrl) {
                  try { URL.revokeObjectURL(this.objUrl); } catch (e) {}
                  this.objUrl = null;
               }
               try {
                  this.video.removeAttribute("src");
                  this.video.load();
               } catch (e) {}
               this.ms = null;
               this.sb = null;
            };

            /* --------------------- Điều khiển phát của nhánh fMP4 --------------------- */

            function clearFmp4Watchers() {
               // 🔴 Bản 23/09 không giữ handle của vòng 500ms nên không bao giờ dừng được nó:
               // cast lần thứ N là N vòng cùng ghi `currentTime`.
               if (fmp4ReadyTimer) { clearInterval(fmp4ReadyTimer); fmp4ReadyTimer = null; }
               if (fmp4PaceTimer) { clearInterval(fmp4PaceTimer); fmp4PaceTimer = null; }
            }

            /** Nhịp phát của MỘT lượt kết nối — MediaSource mới thì ngưỡng tiếng của Chrome cũng về 200ms. */
            function newFmp4Pace(nowMs) {
               var C = FMP4_CONFIG;
               return {
                  target: C.targetBaseSec,
                  lastMs: nowMs, lastCt: video.currentTime, ticks: 0, lags: [],
                  stallFromMs: 0, stallFromCt: 0, stallRate: 1, stallLagBefore: 0, lastRateMs: 0,
                  lastStallMs: nowMs, lastCheckMs: nowMs, lowWater: Infinity, catchUpUntilMs: 0,
                  ignoreStallUntilMs: nowMs + C.selfSeekIgnoreMs,
               };
            }

            function startFmp4Watchers() {
               clearFmp4Watchers();
               var playStarted = false;
               var pace = null;

               fmp4ReadyTimer = setInterval(function () {
                  if (activeBranch !== "fmp4") { clearFmp4Watchers(); return; }
                  try {
                     var buf = video.buffered;
                     if (buf.length === 0) return;
                     var end = buf.end(buf.length - 1);
                     var start = buf.start(0);
                     var startLag = FMP4_CONFIG.targetBaseSec + FMP4_CONFIG.startExtraSec;
                     if (end - start < startLag) return;

                     clearInterval(fmp4ReadyTimer);
                     fmp4ReadyTimer = null;

                     var target = Math.max(end - startLag, start);
                     try { video.currentTime = target; } catch (e) {}
                     video.muted = false;
                     video.volume = 1.0;
                     video.play().then(
                        function () {
                           log("▶️ PLAY [" + diag.mode + "] buffer=" + (end - start).toFixed(2) +
                               "s seek→" + target.toFixed(2) +
                               "  | tới khung đầu: " + (Date.now() - T_BOOT) + "ms");
                        },
                        function (e) { log("🔴 play() từ chối: " + e); },
                     );
                     playStarted = true;
                     pace = newFmp4Pace(Date.now());
                     diag.fmp4Target = pace.target;
                     background.classList.add("hidden");
                     hideLoading();
                  } catch (e) {
                     log("🔴 checkReady: " + e);
                  }
               }, 100);

               fmp4PaceTimer = setInterval(function () {
                  if (activeBranch !== "fmp4") { clearFmp4Watchers(); return; }
                  if (!playStarted || !pace) return;
                  try { fmp4PaceTick(pace); } catch (e) {}
               }, FMP4_CONFIG.tickMs);
            }

            /**
             * Một nhịp: đo đứng hình, cập nhật `đích`, và (mỗi `decideEveryTicks`) chọn tốc độ phát.
             * Đứng hình KHÔNG đòi đệm cạn — xem đầu `FMP4_CONFIG`.
             */
            function fmp4PaceTick(p) {
               var C = FMP4_CONFIG;
               var now = Date.now();
               var buf = video.buffered;
               var ct = video.currentTime;
               if (buf.length === 0) { p.lastMs = now; p.lastCt = ct; return; }
               var end = buf.end(buf.length - 1);
               var lag = end - ct;
               var rate = video.playbackRate || 1;
               var expectedMs = (now - p.lastMs) * rate;
               var moving = (ct - p.lastCt) * 1000 >= C.stallAdvanceRatio * expectedMs;
               var active = !video.paused && !video.seeking && expectedMs > 0;
               var frozen = active && !moving && now >= p.ignoreStallUntilMs;

               if (frozen && !p.stallFromMs) {
                  p.stallFromMs = p.lastMs;
                  p.stallFromCt = p.lastCt;
                  p.stallRate = rate;
                  var recent = p.lags.slice(-1000 / C.tickMs);
                  p.stallLagBefore = recent.length ? Math.max.apply(null, recent) : lag;
               } else if (p.stallFromMs && !frozen) {
                  var from = p.stallFromMs;
                  p.stallFromMs = 0;
                  if (active && moving) {
                     // Thời gian mất = giờ thật trôi − giờ media trôi: chính xác hơn độ phân giải 100ms.
                     var lostMs = Math.round((now - from) - (ct - p.stallFromCt) * 1000 / p.stallRate);
                     if (lostMs >= C.minStallMs) onFmp4Stall(p, lostMs, lag, now);
                  }
               }

               if (p.stallFromMs && now - p.stallFromMs >= C.rescueAfterMs && lag >= p.target + 0.1) {
                  rescueFmp4Stall(p, Math.round(now - p.stallFromMs), lag, now);
                  return;
               }

               if (active && !frozen) {
                  if (lag < p.lowWater) p.lowWater = lag;
                  p.lags.push(lag);
                  if (p.lags.length > C.lagWindowSec * 1000 / C.tickMs) p.lags.shift();
               }
               p.lastMs = now;
               p.lastCt = ct;
               if (fmp4Diag) fmp4DiagTick(fmp4Diag, lag, active && !frozen, p.target, now);
               if (maybeCatchUpFmp4(p, now)) return;

               if (now - p.lastCheckMs >= C.checkEverySec * 1000) {
                  p.lastCheckMs = now;
                  if (p.lowWater < C.nearMissSec) {
                     p.target = Math.min(C.targetMaxSec, p.target + C.stallStepSec);
                  } else if (p.target > C.targetBaseSec && now - p.lastStallMs >= C.calmSec * 1000 &&
                             p.lowWater >= C.decaySpareSec) {
                     p.target = Math.max(C.targetBaseSec, p.target - C.decayStepSec);
                  }
                  p.lowWater = Infinity;
                  diag.fmp4Target = p.target;
               }

               if (++p.ticks % C.decideEveryTicks !== 0) return;
               // Cửa sổ vừa bị xoá (khởi động, đứng hình, nhảy) ⇒ chờ đầy một nửa mới quyết.
               if (p.stallFromMs || p.lags.length * C.tickMs < C.lagWindowSec * 1000 / 2) return;
               decideFmp4Rate(p, Math.min.apply(null, p.lags), Math.max.apply(null, p.lags), now);
            }

            /** Trong cửa sổ bắt kịp sau một lần đứng: dư nhiều và đã xả xong ⇒ nhảy về đích. Xem `catchUpWindowMs`. */
            function maybeCatchUpFmp4(p, now) {
               var C = FMP4_CONFIG;
               if (now >= p.catchUpUntilMs || p.stallFromMs || now < p.ignoreStallUntilMs) return false;
               var n = 1000 / C.tickMs;
               if (p.lags.length < n) return false;
               var recent = p.lags.slice(-n);
               var lagMin = Math.min.apply(null, recent);
               if (lagMin <= p.target + C.catchUpOverSec) return false;
               if (recent[recent.length - 1] - recent[0] >= C.catchUpStableSec) return false;
               log("⏭ bắt kịp: lag " + lagMin.toFixed(2) + "s ⇒ nhảy về đích " + p.target.toFixed(2) + "s");
               if (fmp4Diag) {
                  fmp4Diag.seeks++; fmp4Diag.win.seeks++;
                  reportFmp4Diag("⏭ bắt kịp sau đứng hình: lag " + lagMin.toFixed(2) + "s ⇒ nhảy về đích " +
                     p.target.toFixed(2) + "s");
               }
               seekFmp4NearLive(p, now);
               setFmp4Rate(1.0, lagMin);
               return true;
            }

            /** Hình vừa chạy lại sau khi đứng: chấp nhận mức đệm Chrome vừa đòi làm đích mới. */
            function onFmp4Stall(p, lostMs, lagAtResume, now) {
               var C = FMP4_CONFIG;
               var before = p.target;
               p.target = Math.min(C.targetMaxSec,
                  Math.max(C.targetBaseSec, p.target + C.stallStepSec, lagAtResume));
               p.lastStallMs = now;
               p.lastCheckMs = now;
               p.lowWater = Infinity;
               p.lags = [];
               p.catchUpUntilMs = now + C.catchUpWindowMs;
               diag.fmp4Target = p.target;
               setFmp4Rate(1.0, lagAtResume);
               log("⛔ đứng " + lostMs + "ms ⇒ đích " + before.toFixed(2) + " → " + p.target.toFixed(2) + "s");
               if (fmp4Diag) fmp4DiagStall(fmp4Diag, lostMs, p.stallLagBefore, p.stallRate, lagAtResume, p.target);
            }

            /**
             * Seek về `đích` sau live edge — không lùi quá đầu đoạn `buffered` cuối: đoạn cuối ngắn hơn `đích`
             * (vừa qua một khe) mà seek vào khe là Chrome đứng ở `seeking` mãi.
             */
            function seekFmp4NearLive(p, now) {
               var buf = video.buffered;
               var last = buf.length - 1;
               video.currentTime = Math.max(buf.end(last) - p.target, buf.start(last));
               p.lags = [];
               p.ignoreStallUntilMs = now + FMP4_CONFIG.selfSeekIgnoreMs;
               p.lastMs = now;
               p.lastCt = video.currentTime;
            }

            /**
             * Đứng quá `rescueAfterMs` dù đệm vẫn có: đừng chờ Chrome nữa — ngưỡng của nó có thể đã bị nhân đôi
             * tới 1,6–3s, hoặc nó kẹt ở khe và sẽ không bao giờ tự chạy. Seek về `end − đích` (bỏ qua phần trễ dư)
             * rồi nâng đích một nấc, vì lần hụt dẫn tới đây vẫn là bằng chứng đệm mỏng.
             */
            function rescueFmp4Stall(p, lostMs, lag, now) {
               var C = FMP4_CONFIG;
               var before = p.target;
               p.stallFromMs = 0;
               p.target = Math.min(C.targetMaxSec, p.target + C.stallStepSec);
               p.lastStallMs = now;
               p.lastCheckMs = now;
               p.lowWater = Infinity;
               p.catchUpUntilMs = now + C.catchUpWindowMs;
               diag.fmp4Target = p.target;
               seekFmp4NearLive(p, now);
               setFmp4Rate(1.0, lag);
               log("🛟 đứng " + lostMs + "ms vẫn chưa chạy (lag " + lag.toFixed(2) + "s) ⇒ nhảy, đích " +
                   before.toFixed(2) + " → " + p.target.toFixed(2) + "s");
               if (fmp4Diag) {
                  fmp4Diag.seeks++; fmp4Diag.win.seeks++;
                  fmp4DiagStall(fmp4Diag, lostMs, p.stallLagBefore, p.stallRate, lag, p.target, "nhảy cứu");
               }
            }

            /**
             * Chọn tốc độ theo đáy (`lagMin`) và đỉnh (`lagMax`) của lag trong `lagWindowSec` so với `đích`.
             * Trễ ngược ở cả hai chiều; giữa hai ngưỡng thì giữ nguyên tốc độ đang có.
             */
            function decideFmp4Rate(p, lagMin, lagMax, now) {
               var C = FMP4_CONFIG;
               var t = p.target;
               var rate = video.playbackRate;
               if (lagMin > t + C.hardSeekOverSec) {
                  seekFmp4NearLive(p, now);
                  setFmp4Rate(1.0, lagMin);
                  log("⏩ đáy lag " + lagMin.toFixed(2) + "s ⇒ nhảy về đích " + t.toFixed(2) + "s");
                  if (fmp4Diag) { fmp4Diag.seeks++; fmp4Diag.win.seeks++; }
                  return;
               }
               var chase = lagMin > t + C.fastChaseOverSec ? C.fastChaseRate : C.chaseRate;
               var want = rate;
               if (rate > 1) {
                  want = lagMin <= t + C.chaseExitOverSec ? 1.0 : chase;
               } else if (lagMin > t + C.chaseOverSec) {
                  want = chase;
               } else if (rate < 1) {
                  if (lagMax >= t + C.refillExitOverSec) want = 1.0;
               } else if (lagMax < t) {
                  want = C.refillRate;
               }
               if (want === rate) return;
               // Về ×1 luôn được phép ngay — giữ đuổi/bồi thêm vài giây lúc lag đang tụt là rút đệm đúng lúc nguy.
               if (want !== 1.0 && now - p.lastRateMs < C.rateHoldSec * 1000) return;
               p.lastRateMs = now;
               setFmp4Rate(want, want < 1 ? lagMax : lagMin);
            }

            /** Đổi tốc độ phát của nhánh fMP4 — chỉ khi khác, và ghi log để đối chiếu với lúc giật. */
            function setFmp4Rate(rate, lag) {
               if (video.playbackRate === rate) return;
               video.playbackRate = rate;
               log("tốc độ ×" + rate + " (lag " + lag.toFixed(2) + "s)");
               if (fmp4Diag) { fmp4Diag.rateChanges++; fmp4Diag.win.rateChanges++; }
            }

            function stopFmp4() {
               clearFmp4Watchers();
               if (fmp4RetryTimer) { clearTimeout(fmp4RetryTimer); fmp4RetryTimer = null; }
               ++fmp4ConnSeq;            // lượt kết nối còn bay của phiên này tự bỏ
               fmp4Retries = 0;
               var previous = fmp4;
               fmp4 = null;
               diag.fmp4 = null;
               fmp4Diag = null;
               diag.fmp4Diag = null;
               diag.fmp4Target = null;
               if (previous) {
                  try { previous.destroy(); } catch (e) {}
               }
            }

            function stopFmp4IfCurrent(player, message) {
               if (fmp4 !== player) return;
               stopAll();
               if (message) showFatal(message);
            }

            function startFmp4(url) {
               video.style.objectFit = "cover";
               diag.mode = "fMP4/MSE";

               if (!window.fetch || !window.ReadableStream || !window.MediaSource) {
                  activeBranch = null;
                  showFatal("TV không hỗ trợ MSE — không phát được luồng này");
                  return null;
               }

               fmp4Url = url;
               fmp4Retries = 0;
               fmp4EverPlayed = false;
               fmp4Diag = diagOn ? newFmp4Diag() : null;
               diag.fmp4Diag = fmp4Diag;
               // Một kết nối duy nhất, và nó được DÙNG LUÔN để phát — không thăm dò rồi nối lại.
               // Chỉ nối lại khi luồng đã đứt (xem `recoverFmp4`).
               connectFmp4();
               return null;
            }

            /** `fetch` có hạn chờ header: điện thoại vừa đổi mạng thì một fetch có thể treo rất lâu. */
            function fetchFmp4(url) {
               var ctrl = typeof AbortController === "function" ? new AbortController() : null;
               var timer = ctrl ? setTimeout(function () {
                  try { ctrl.abort(); } catch (e) {}
               }, FMP4_CONFIG.connectTimeoutMs) : null;
               // Có header là thôi hẹn giờ: huỷ SAU lúc đó là cắt luôn thân luồng đang phát.
               var settle = function () { if (timer) { clearTimeout(timer); timer = null; } };
               return fetch(url, ctrl ? { signal: ctrl.signal } : undefined).then(
                  function (res) { settle(); return res; },
                  function (err) { settle(); throw err; },
               );
            }

            function connectFmp4() {
               var seq = ++fmp4ConnSeq;
               var current = function () { return activeBranch === "fmp4" && seq === fmp4ConnSeq; };
               fetchFmp4(fmp4Url).then(
                  function (res) {
                     if (!current()) { try { res.body.cancel(); } catch (e) {} return; }
                     log("HTTP " + res.status + " content-type=" +
                         (res.headers.get("content-type") || "(trống)"));
                     if (typeof res.status === "number" && (res.status < 200 || res.status > 299)) {
                        try { res.body.cancel(); } catch (e) {}
                        recoverFmp4("HTTP " + res.status);
                        return;
                     }
                     var reader = res.body.getReader();
                     reader.read().then(
                        function (r) {
                           if (!current()) { try { reader.cancel(); } catch (e) {} return; }
                           if (r.done) {
                              // Đã từng lên hình ⇒ lượt nối lại gặp đúng lúc điện thoại dừng phiên.
                              // Chưa từng ⇒ cast hỏng ngay từ đầu: báo như bản ổn định.
                              if (fmp4EverPlayed) {
                                 endFmp4FromPhone("điện thoại kết thúc luồng ngay khi nối lại");
                              } else {
                                 stopAll();
                                 showFatal("Điện thoại chưa gửi dữ liệu — thử cast lại");
                              }
                              return;
                           }
                           var first = new Uint8Array(r.value);
                           // Kiểm chéo bằng byte: "ftyp" ở offset 4 của fMP4
                           var isFtyp = first.length > 8 &&
                              first[4] === 0x66 && first[5] === 0x74 &&
                              first[6] === 0x79 && first[7] === 0x70;
                           log("byte đầu: " + (isFtyp ? "ftyp ✅ fMP4"
                              : "0x" + first[0].toString(16) + " ⚠️ không phải ftyp"));
                           fmp4 = new Fmp4Player(video);
                           diag.fmp4 = fmp4;
                           fmp4.start(first, reader);
                           startFmp4Watchers();
                        },
                        function (err) {
                           if (current()) recoverFmp4("đọc lỗi: " + err);
                        },
                     );
                  },
                  function (err) {
                     // KHÔNG lùi sang mpegts.js ở đây: app đã khai luồng này là fMP4, ép byte fMP4
                     // vào mpegts.js chỉ đổi một lỗi rõ ràng lấy một lỗi khó đọc.
                     if (current()) recoverFmp4("fetch lỗi: " + err);
                  },
               );
            }

            /** Luồng đứt: dựng lại kết nối thay vì chết phiên; hết lượt mới báo lỗi. Watcher không dọn ở đây —
             *  chúng đứng yên khi `buffered` rỗng, lượt nối thành công gọi lại `startFmp4Watchers()`. */
            function recoverFmp4(reason) {
               if (activeBranch !== "fmp4") return;
               var player = fmp4;
               // Đã chạy khoẻ đủ lâu thì đây là sự cố MỚI, không phải lượt tiếp của chuỗi hỏng cũ.
               if (player && player.dataAtMs > 0 &&
                   Date.now() - player.dataAtMs >= FMP4_CONFIG.reconnectHealthyMs) fmp4Retries = 0;
               ++fmp4ConnSeq;                         // vô hiệu mọi callback còn bay của lượt cũ
               fmp4 = null;
               diag.fmp4 = null;
               if (player) { try { player.destroy(); } catch (e) {} }
               if (fmp4RetryTimer) { clearTimeout(fmp4RetryTimer); fmp4RetryTimer = null; }

               var delays = FMP4_CONFIG.reconnectDelaysMs;
               if (fmp4Retries >= delays.length) {
                  log("🔴 " + reason + " — hết " + delays.length + " lượt nối lại");
                  var msg = fmp4EverPlayed ? "Mất kết nối tới điện thoại — thử cast lại"
                                           : "Không kết nối được tới điện thoại";
                  stopAll();
                  showFatal(msg);
                  return;
               }
               var delay = delays[fmp4Retries++];
               log("⚠️ " + reason + " ⇒ nối lại lần " + fmp4Retries + " sau " + delay + "ms");
               if (fmp4Diag) {
                  fmp4Diag.reconnects++;
                  reportFmp4Diag("🔌 " + reason + " ⇒ nối lại lần " + fmp4Retries + " sau " + delay + "ms");
               }
               // Player vừa bị huỷ ⇒ màn hình đen tới khi nối lại xong; watcher ẩn vòng chờ khi có hình.
               showLoading();
               fmp4RetryTimer = setTimeout(function () {
                  fmp4RetryTimer = null;
                  if (activeBranch === "fmp4") connectFmp4();
               }, delay);
            }

            /** Điện thoại KẾT THÚC GỌN luồng (reader `done`): về màn chờ, không báo lỗi, không nối lại.
             *  🔴 Bấm Dừng trên điện thoại không gửi STOP qua Cast — receiver chỉ biết qua luồng kết thúc; coi `done`
             *  là đứt (2026-10-01a) thì mọi lần dừng thành "Mất kết nối" sau ~3,5s. Đứt thật thì Chrome báo LỖI. */
            function endFmp4FromPhone(reason) {
               if (activeBranch !== "fmp4") return;
               log("⏹ " + reason + " — điện thoại đã dừng luồng, về màn chờ");
               stopAll();
            }

            /** Lỗi của thẻ <video> khi nhánh fMP4 đang giữ nó — điều phối từ bộ lắng nghe dùng chung. */
            function onFmp4VideoError() {
               var err = video.error;
               // `fmp4` rỗng = đang chờ nối lại hoặc vừa dọn ⇒ lỗi muộn của nguồn cũ. `error` rỗng =
               // nguồn mới đã nạp sau khi sự kiện được xếp hàng. Cả hai đều không phải của luồng này.
               if (!fmp4 || !err) return;
               log("VIDEO ERROR code=" + err.code + " msg=" + (err.message || ""));
               // MEDIA_ERR_SRC_NOT_SUPPORTED: TV không giải mã nổi định dạng — nối lại cũng vậy.
               if (err.code === 4) {
                  stopAll();
                  showFatal("TV không hỗ trợ định dạng video này");
                  return;
               }
               recoverFmp4("video error code=" + err.code);
            }

            /* ══════════════════════ Điều phối LOAD / STOP ══════════════════════ */

            manager.setMessageInterceptor(
               cast.framework.messages.MessageType.STOP,
               function (request) {
                  stopAll();
                  clearFatal();
                  return request;
               },
            );

            manager.setMessageInterceptor(
               cast.framework.messages.MessageType.LOAD,
               function (request) {
                  stopAll();
                  clearFatal();
                  if (!request || !request.media) return request;

                  var ticket = ++loadSeq;
                  var url = request.media.contentId || "";
                  setDiagForLoad(/[?&]diag=1(?:[&#]|$)/.test(url));
                  var ct = (request.media.contentType || "").toLowerCase();
                  log("LOAD ⇒ " + url + "  type=" + ct +
                      "  (+" + (Date.now() - T_BOOT) + "ms từ lúc receiver chạy)");

                  // Chỉ nhận luồng mirror; media thông thường tiếp tục qua CAF.
                  if (!/\/stream\.ts(?:[?#]|$)/i.test(url)) return request;

                  // Từ đây tới khung hình đầu là khoảng màn hình đen — mỗi nhánh tự ẩn khi lên hình.
                  showLoading();

                  // Thiếu/không đọc được contentType ⇒ MPEG-TS. Đó là mặc định của mọi bản app
                  // đang ở ngoài thị trường, và là nhánh đã chạy ổn định.
                  if (ct.indexOf("mp4") >= 0 && ct.indexOf("mp2t") < 0) {
                     activeBranch = "fmp4";
                     return startFmp4(url);
                  }
                  activeBranch = "ts";
                  return startMpegTs(url, request, ticket);
               },
            );

            /* Overlay số liệu — chỉ dựng khi bật chẩn đoán; CHỈ ĐỌC, không đụng playback. */
            function startDiagOverlay() {
               if (diagOverlayStarted) return;
               diagOverlayStarted = true;
               setInterval(function () {
                  try {
                     var v = video;
                     var buf = v.buffered;
                     var bufStr = "—", lagStr = "—";
                     if (buf.length > 0) {
                        var end = buf.end(buf.length - 1);
                        bufStr = (end - buf.start(0)).toFixed(2) + "s";
                        lagStr = (end - v.currentTime).toFixed(2) + "s";
                        // gom lag để đọc được xu hướng, không phải một mẫu nhiễu
                        var lagNow = end - v.currentTime;
                        if (isFinite(lagNow) && lagNow >= 0 && !v.paused) {
                           lagHist.push(lagNow);
                           if (lagHist.length > 40) lagHist.shift(); // ~20s ở nhịp 500ms
                        }
                     }
                     var lagAvg = "—", lagMin = "—", lagMax = "—";
                     if (lagHist.length > 3) {
                        var sum = 0, mn = 1e9, mx = -1e9;
                        for (var i = 0; i < lagHist.length; i++) {
                           sum += lagHist[i];
                           if (lagHist[i] < mn) mn = lagHist[i];
                           if (lagHist[i] > mx) mx = lagHist[i];
                        }
                        lagAvg = (sum / lagHist.length).toFixed(2) + "s";
                        lagMin = mn.toFixed(2); lagMax = mx.toFixed(2);
                     }
                     var f = diag.fmp4;
                     statsEl.textContent =
                        "mode       " + diag.mode + "\n" +
                        "branch     " + (activeBranch || "—") + "\n" +
                        "LAG(live)  " + lagStr + (v.playbackRate > 1 ? "  ⏩đuổi" : v.playbackRate < 1 ? "  ⏪bồi" : "") + "\n" +
                        (diag.fmp4Target ? "đích       " + diag.fmp4Target.toFixed(2) + "s\n" : "") +
                        "lag avg    " + lagAvg + "  (" + lagMin + "–" + lagMax + ")\n" +
                        "buffer     " + bufStr + "\n" +
                        "curTime    " + v.currentTime.toFixed(2) + "\n" +
                        "rate       " + v.playbackRate + "\n" +
                        "readyState " + v.readyState + "\n" +
                        "paused     " + v.paused + "\n" +
                        "bytes in   " + (f ? (f.bytesIn / 1024).toFixed(0) + " KB" : "—") + "\n" +
                        "appends    " + (f ? f.appends : "—") + "\n" +
                        "queue      " + (f ? f.queue.length : "—") +
                        (diag.fmp4Diag
                           ? "\nkhựng      " + diag.fmp4Diag.stalls + " lần, " + diag.fmp4Diag.stallMs +
                             "ms (dài nhất " + diag.fmp4Diag.maxStallMs + "ms)\n" +
                             "waiting    " + diag.fmp4Diag.waiting + "\n" +
                             "đổi tốc độ " + diag.fmp4Diag.rateChanges + ", nhảy " + diag.fmp4Diag.seeks +
                             ", nối lại " + diag.fmp4Diag.reconnects
                           : "");
                  } catch (e) {
                     // Báo một lần — `catch` rỗng ở đây từng giấu lỗi làm overlay trống không lý do.
                     if (!statsErrShown) {
                        statsErrShown = true;
                        log("🔴 khối số liệu lỗi: " + e);
                     }
                  }
               }, 500);

               // Các lắng nghe dưới chỉ để ghi log/đếm — bản phát hành không đăng ký.
               window.addEventListener("error", function (e) {
                  log("🔴 JS ERROR: " + (e.message || e) + " @" + (e.lineno || "?"));
               });
               window.addEventListener("unhandledrejection", function (e) {
                  log("🔴 PROMISE REJECT: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
               });
               // `waiting` = trình duyệt tự báo hết dữ liệu để phát — đối chiếu với số khựng tự đo.
               video.addEventListener("waiting", function () {
                  if (activeBranch === "fmp4" && fmp4Diag) { fmp4Diag.waiting++; fmp4Diag.win.waiting++; }
               });
            }
            if (diagOn) startDiagOverlay();

            log("receiver khởi động — bản " + RECEIVER_VERSION);
            // `skipPlayersLoad`: không nạp Shaka + MPL (~1 MB) receiver không dùng — đỡ hàng giây màn đen trên TV
            // yếu. Đánh đổi: đường "nhường CAF" không còn trình phát (đường đó đã hiện lỗi trước khi nhường).
            context.start({ disableIdleTimeout: true, skipPlayersLoad: true });
         })();
      </script>
   </body>
</html>
