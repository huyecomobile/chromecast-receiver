<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EcoMirror Tốc Độ Cao</title>
  <script type="text/javascript" src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #fff; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <video id="tvPlayer" autoplay muted></video>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();
    let mpegtsPlayer = null;

    function createPlayer(streamUrl) {
        const videoElement = document.getElementById('tvPlayer');
        if (mpegtsPlayer) {
            try { mpegtsPlayer.destroy(); } catch(e) {}
            mpegtsPlayer = null;
        }

        mpegtsPlayer = mpegts.createPlayer({
            type: 'mse',
            isLive: true,
            url: streamUrl,
            cors: true
        }, {
 enableStashBuffer: false,        // GIỮ NGUYÊN code gốc
    stashInitialSize: 128,           // GIỮ NGUYÊN code gốc  
    liveBufferLatencyChasing: true,  // GIỮ NGUYÊN code gốc
    lazyLoad: false,                 // ← CHỈ THÊM DÒNG NÀY
    deferLoadAfterSourceOpen: false   // ← VÀ DÒNG NÀY
        });

        mpegtsPlayer.on(mpegts.Events.ERROR, (errorType, errorDetail, errorInfo) => {
            console.error('mpegts error:', errorType, errorDetail, errorInfo);
            setTimeout(() => { createPlayer(streamUrl); }, 2000);
        });

        mpegtsPlayer.on(mpegts.Events.STATISTICS_INFO, (stats) => {
            try {
                const buffered = videoElement.buffered;
                if (buffered.length > 0 && stats.droppedFrames > 50) {
                    videoElement.currentTime = buffered.end(buffered.length - 1) - 0.3;
                }
            } catch (e) {}
        });

        mpegtsPlayer.attachMediaElement(videoElement);
        mpegtsPlayer.load();
        
        // Unmute sau khi play thành công
        videoElement.play().then(() => {
            videoElement.muted = false;
        }).catch(() => {
            // Chromecast autoplay policy — thử lại với muted
            videoElement.muted = true;
            videoElement.play();
        });
    }

    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      request => {
        const streamUrl = request.media.contentId;
        if (mpegts.getFeatureList().mseLivePlayback) {
            createPlayer(streamUrl);
            return null;
        }
        return request;
      }
    );

    context.start({ disableIdleTimeout: true });
  </script>
</body>
</html>
