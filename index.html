<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EcoMirror</title>
  <script type="text/javascript" src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
    #tvPlayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 9999; background: #000; }
    #debug { position: absolute; top: 10px; left: 10px; color: #0f0; font-size: 24px; z-index: 99999; font-family: monospace; background: rgba(0,0,0,0.8); padding: 15px; white-space: pre; }
  </style>
</head>
<body>
  <video id="tvPlayer" muted></video>
  <div id="debug">Loading...</div>
  <script>
    var context = cast.framework.CastReceiverContext.getInstance();
    var playerManager = context.getPlayerManager();
    var mpegtsErrors = [];

    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      function(request) {
        var streamUrl = request.media.contentId;
        if (!mpegts.getFeatureList().mseLivePlayback) return request;

        var videoElement = document.getElementById('tvPlayer');
        var debugEl = document.getElementById('debug');
        var playStarted = false;

        var player = mpegts.createPlayer({
            type: 'mse',
            isLive: true,
            url: streamUrl
        }, {
            enableStashBuffer: false,
            stashInitialSize: 128,
            lazyLoad: false,
            deferLoadAfterSourceOpen: false,
            autoCleanupSourceBuffer: true,
            autoCleanupMaxBackwardDuration: 10,
            autoCleanupMinBackwardDuration: 5,
            fixAudioTimestampGap: true
        });

        player.on(mpegts.Events.ERROR, function(e, d, i) {
            mpegtsErrors.push(e + ':' + d);
        });

        player.attachMediaElement(videoElement);
        player.load();

        setInterval(function() {
            try {
                var buf = videoElement.buffered;
                if (buf.length > 0) {
                    var end = buf.end(buf.length - 1);
                    var ahead = end - videoElement.currentTime;

                    if (!playStarted) {
                        // Đợi buffer đủ 3 giây trước khi play lần đầu
                        if (end - buf.start(0) > 3) {
                            videoElement.currentTime = end - 2;
                            videoElement.play().catch(function(){});
                            playStarted = true;
                        }
                    } else {
                        // Nếu buffer quá xa → nhảy tới live edge
                        if (ahead > 6) {
                            videoElement.currentTime = end - 2;
                        }
                        // Nếu bị stall (hết buffer) → nhảy lại vị trí có buffer
                        if (videoElement.readyState <= 2 && ahead < 0.5 && ahead >= 0) {
                            videoElement.currentTime = Math.max(buf.start(0), end - 2);
                            videoElement.play().catch(function(){});
                        }
                    }
                }
                if (playStarted && videoElement.paused) {
                    videoElement.play().catch(function(){});
                }
            } catch(e) {}

            var info = '';
            info += 'paused: ' + videoElement.paused + '\n';
            info += 'readyState: ' + videoElement.readyState + '\n';
            info += 'currentTime: ' + videoElement.currentTime.toFixed(3) + '\n';
            info += 'networkState: ' + videoElement.networkState + '\n';
            var bufInfo = '';
            try {
                for (var i = 0; i < videoElement.buffered.length; i++) {
                    bufInfo += videoElement.buffered.start(i).toFixed(2) + '-' + videoElement.buffered.end(i).toFixed(2) + ' ';
                }
            } catch(e) { bufInfo = 'error'; }
            info += 'buffered: ' + (bufInfo || 'empty') + '\n';
            info += 'error: ' + (videoElement.error ? 'code=' + videoElement.error.code : 'none') + '\n';
            info += 'started: ' + playStarted + '\n';
            info += 'mpegts_err: ' + (mpegtsErrors.length > 0 ? mpegtsErrors.slice(-2).join(', ') : 'none');
            debugEl.innerText = info;
        }, 500);

        return null;
      }
    );

    context.start({ disableIdleTimeout: true });
  </script>
</body>
</html>
