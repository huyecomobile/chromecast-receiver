<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CastDuo</title>
  <script type="text/javascript" src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
    #bgImage {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: 1;
      transition: opacity 0.8s ease;
    }
    #bgImage.hidden { opacity: 0; pointer-events: none; }
    #tvPlayer {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain; z-index: 9999;
      background: transparent;
    }
  </style>
</head>
<body>
  <img id="bgImage" src="https://iconchangerstorage.ecomobileapp.com/static/storage/huy/Congratulation.png" alt="EcoMirror Background" />
  <video id="tvPlayer"></video>

  <script>
    var context = cast.framework.CastReceiverContext.getInstance();
    var playerManager = context.getPlayerManager();
    var bgImage = document.getElementById('bgImage');

    // Tracking state
    var currentPlayer = null;
    var checkReadyInterval = null;
    var latencyInterval = null;
    var playStarted = false;
    var reconnectTimer = null;
    var lastStreamUrl = '';

    function cleanup() {
        playStarted = false;
        if (checkReadyInterval) { clearInterval(checkReadyInterval); checkReadyInterval = null; }
        if (latencyInterval) { clearInterval(latencyInterval); latencyInterval = null; }
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        if (currentPlayer) {
            try {
                currentPlayer.pause();
                currentPlayer.unload();
                currentPlayer.detachMediaElement();
                currentPlayer.destroy();
            } catch(e) {}
            currentPlayer = null;
        }
    }

    function startPlayback(streamUrl) {
        cleanup();
        lastStreamUrl = streamUrl;

        var videoElement = document.getElementById('tvPlayer');
        if (!mpegts.getFeatureList().mseLivePlayback) return;

        var player = mpegts.createPlayer({
            type: 'mse',
            isLive: true,
            url: streamUrl
        }, {
            enableStashBuffer: false,
            stashInitialSize: 384,
            lazyLoad: false,
            deferLoadAfterSourceOpen: false,
            autoCleanupSourceBuffer: true,
            autoCleanupMaxBackwardDuration: 8,
            autoCleanupMinBackwardDuration: 4,
            fixAudioTimestampGap: true,
            liveBufferLatencyChasing: true,
            liveBufferLatencyMaxLatency: 1.5,
            liveBufferLatencyMinRemain: 0.3
        });

        currentPlayer = player;

        player.on(mpegts.Events.ERROR, function(e, d, i) {
            // Auto-reconnect sau 2 giây
            if (!reconnectTimer) {
                reconnectTimer = setTimeout(function() {
                    reconnectTimer = null;
                    startPlayback(lastStreamUrl);
                }, 2000);
            }
        });

        player.attachMediaElement(videoElement);
        player.load();

        // Đợi buffer đủ rồi play ở live edge
        checkReadyInterval = setInterval(function() {
            try {
                var buf = videoElement.buffered;
                if (buf.length > 0) {
                    var end = buf.end(buf.length - 1);
                    var start = buf.start(0);
                    if (end - start >= 0.8) {
                        clearInterval(checkReadyInterval);
                        checkReadyInterval = null;
                        videoElement.currentTime = Math.max(end - 0.3, start);
                        videoElement.muted = false;
                        videoElement.volume = 1.0;
                        videoElement.play().catch(function(){});
                        playStarted = true;
                        bgImage.classList.add('hidden');
                    }
                }
            } catch(e) {}
        }, 200);

        // Latency chasing — nhảy khi lag quá xa
        latencyInterval = setInterval(function() {
            if (!playStarted) return;
            try {
                var buf = videoElement.buffered;
                if (buf.length > 0) {
                    var end = buf.end(buf.length - 1);
                    if (end - videoElement.currentTime > 2.5) {
                        videoElement.currentTime = end - 0.3;
                    }
                }
            } catch(e) {}
        }, 500);
    }

    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      function(request) {
        var streamUrl = request.media.contentId;
        startPlayback(streamUrl);
        return null;
      }
    );

    context.start({ disableIdleTimeout: true });
  </script>
</body>
</html>
