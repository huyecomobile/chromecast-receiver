<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EcoMirror</title>
  <script type="text/javascript" src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
    #tvPlayer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      z-index: 9999;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="tvPlayer" autoplay playsinline></video>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const playerManager = context.getPlayerManager();

    playerManager.setMessageInterceptor(
      cast.framework.messages.MessageType.LOAD,
      request => {
        const streamUrl = request.media.contentId;
        if (!mpegts.getFeatureList().mseLivePlayback) return request;

        const videoElement = document.getElementById('tvPlayer');
        const player = mpegts.createPlayer({
            type: 'mse',
            isLive: true,
            url: streamUrl,
            cors: true
        }, {
            enableStashBuffer: false,
            liveBufferLatencyChasing: true,
            liveBufferLatencyMaxLatency: 1.5,
            liveBufferLatencyMinRemain: 0.3,
            lazyLoad: false,
            deferLoadAfterSourceOpen: false,
            autoCleanupSourceBuffer: true,
            autoCleanupMaxBackwardDuration: 5,
            autoCleanupMinBackwardDuration: 3,
            fixAudioTimestampGap: true
        });

        player.on(mpegts.Events.ERROR, (e, d, i) => {
            console.error('mpegts error:', e, d, i);
        });

        player.attachMediaElement(videoElement);
        player.load();

        // Gọi play() liên tục đến khi thành công
        function tryPlay() {
            videoElement.play().catch(() => {
                setTimeout(tryPlay, 500);
            });
        }
        tryPlay();

        // Khi stall → nhảy tới live edge
        videoElement.addEventListener('waiting', () => {
            try {
                const buf = videoElement.buffered;
                if (buf.length > 0) {
                    const end = buf.end(buf.length - 1);
                    if (end - videoElement.currentTime > 0.5) {
                        videoElement.currentTime = end - 0.1;
                    }
                }
            } catch(e) {}
        });

        return null;
      }
    );

    context.start({ disableIdleTimeout: true });
  </script>
</body>
</html>
