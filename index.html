<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8" />
      <title>CastDuo</title>
      <script
         type="text/javascript"
         src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"
      ></script>
      <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.min.js"></script>
      <style>
         body,
         html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
         }
         /* Ảnh nền hiển thị khi chưa play video */
         #bgImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: opacity 0.8s ease;
         }
         #bgImage.hidden {
            opacity: 0;
            pointer-events: none;
         }
         #tvPlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 9999;
            background: transparent;
         }
         #debug {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            font-size: 24px;
            z-index: 99999;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            white-space: pre;
         }
      </style>
   </head>
   <body>
      <!-- Ảnh nền hiển thị khi idle -->
      <img
         id="bgImage"
         src="https://firebasestorage.googleapis.com/v0/b/screen-mirroring-49598.firebasestorage.app/o/chrome_success%2FCongratulation.png?alt=media&token=3dd5488b-3890-43ba-a609-3a62d4e7c7fa"
         alt="EcoMirror Background"
      />
      <video id="tvPlayer"></video>
      <script>
         var context = cast.framework.CastReceiverContext.getInstance();

         var playerManager = context.getPlayerManager();

         var mpegtsErrors = [];

         var bgImage = document.getElementById("bgImage");

         var currentPlayer = null;

         playerManager.setMessageInterceptor(
            cast.framework.messages.MessageType.LOAD,

            function (request) {
               var streamUrl = request.media.contentId;

               if (!mpegts.getFeatureList().mseLivePlayback) return request;

               if (currentPlayer != null) {
                  try {
                     currentPlayer.pause();

                     currentPlayer.unload();

                     currentPlayer.detachMediaElement();

                     currentPlayer.destroy();
                  } catch (e) {}

                  currentPlayer = null;
               }

               var videoElement = document.getElementById("tvPlayer");

               var playStarted = false;

               var player = mpegts.createPlayer(
                  {
                     type: "mse",

                     isLive: true,

                     url: streamUrl,
                  },
                  {
                     enableStashBuffer: true, // ✅ BẬT stash buffer để absorb jitter

                     stashInitialSize: 65536, // ✅ 64KB — đủ cho ~1-2 TS segments

                     lazyLoad: false,

                     deferLoadAfterSourceOpen: false,

                     autoCleanupSourceBuffer: true,

                     autoCleanupMaxBackwardDuration: 5, // ✅ Giảm từ 10 → 5 (tiết kiệm RAM Chromecast)

                     autoCleanupMinBackwardDuration: 2, // ✅ Giảm từ 5 → 2

                     fixAudioTimestampGap: true,

                     liveBufferLatencyChasing: true,

                     liveBufferLatencyMaxLatency: 3.0, // ✅ Tăng lên 3s — cho phép buffer dày hơn

                     liveBufferLatencyMinRemain: 1.0, // ✅ Tăng lên 1s — giữ 1s buffer sau khi chase

                     liveBufferLatencyChasingSpeed: 1.3, // ✅ THÊM MỚI — tăng tốc 1.3x thay vì nhảy cục
                  },
               );

               currentPlayer = player;

               player.on(mpegts.Events.ERROR, function (e, d, i) {
                  mpegtsErrors.push(e + ":" + d);
               });

               player.attachMediaElement(videoElement);

               player.load();

               // Đợi buffer đủ rồi play ở live edge

               var checkReady = setInterval(function () {
                  try {
                     var buf = videoElement.buffered;

                     if (buf.length > 0) {
                        var end = buf.end(buf.length - 1);

                        var start = buf.start(0);

                        if (end - start >= 3) {
                           clearInterval(checkReady);

                           if (!isNaN(videoElement.duration)) {
                              videoElement.currentTime = Math.max(
                                 end - 0.5,
                                 start,
                              );
                           }

                           videoElement.muted = false;

                           videoElement.volume = 1.0;

                           videoElement.play().catch(function () {});

                           playStarted = true;

                           bgImage.classList.add("hidden");
                        }
                     }
                  } catch (e) {}
               }, 200);

               // Chỉ xử lý khi lag quá xa, KHÔNG nhảy ngược

               setInterval(function () {
                  if (!playStarted) return;

                  try {
                     var buf = videoElement.buffered;

                     if (buf.length > 0) {
                        var end = buf.end(buf.length - 1);

                        if (end - videoElement.currentTime > 5) {
                           videoElement.currentTime = end - 0.5;
                        }
                     }
                  } catch (e) {}
               }, 1000);

               return null;
            },
         );

         context.start({ disableIdleTimeout: true });
      </script>
   </body>
</html>
